version: '3.8'

services:
  pdd-sku-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdd-sku-manager
    ports:
      - "5173:5173"
    volumes:
      # 成本配置等业务数据持久化到宿主机（重建容器不丢数据）
      - ./data:/data
    restart: unless-stopped
    networks:
      - pdd-network

networks:
  pdd-network:
    driver: bridge
