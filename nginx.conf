server {
    listen 5173;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # 上传数据（订单/营销）体积较大，放宽请求体上限（默认 1m 会 413）
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # AI API Proxy
    location /api/ai/ {
        proxy_pass https://token.86969678.xyz/;
        proxy_set_header Host token.86969678.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, DELETE, PUT' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, DELETE, PUT';
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # 成本配置云端持久化（聚水潭式资料库：传一次，永久保存）
    # PUT 写入 / DELETE 删除由 ngx_http_dav_module 处理，GET 直接读文件
    location /api/config/ {
        alias /data/;

        # 允许的写操作（官方 nginx:alpine 默认编译了 --with-http_dav_module）
        dav_methods PUT DELETE;

        # PUT 时自动创建临时文件并替换目标
        create_full_put_path on;

        # 允许覆盖已存在的配置文件
        dav_access user:rw group:rw all:rw;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;

        # 预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
