server {
    listen 5173;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # 上传数据（订单/营销）体积较大，放宽请求体上限（默认 1m 会 413）
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 成本配置云端持久化（聚水潭式资料库：传一次，永久保存）
    # PUT 写入 / DELETE 删除由 ngx_http_dav_module 处理，GET 直接读文件
    location /api/config/ {
        alias /data/;

        # 允许的写操作（官方 nginx:alpine 默认编译了 --with-http_dav_module）
        dav_methods PUT DELETE;

        # PUT 时自动创建临时文件并替换目标
        create_full_put_path on;

        # 允许覆盖已存在的配置文件
        dav_access user:rw group:rw all:rw;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;

        # 预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # MCP 服务器（Streamable HTTP）：AI 客户端远程读写成本配置
    # 直连地址 http://<服务器IP>:9100/mcp 也可用；此路径用于 80/443 统一入口的场景
    location /mcp {
        proxy_pass http://mcp:9100/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE 流式响应不缓冲
        proxy_cache off;
        proxy_read_timeout 3600s;     # 长连接（SSE keepalive）
        chunked_transfer_encoding on;
    }

    # 部署地址上报：网页「mcp」按钮本机访问时读取，用于把 localhost 替换为部署 IP
    location = /server-info {
        proxy_pass http://mcp:9100/server-info;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
